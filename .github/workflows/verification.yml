# Formal verification: verifies the Dafny-first production core (src/Auctions.Domain.Verified) and the
# Dafny models of the auction domain, and checks that both the compiled verified core and the skeletons
# generated from [Verify]-annotated C# methods are committed and up to date.
# See verification/README.md.

name: Formal verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools (Dafny)
        run: dotnet tool restore

      - name: Install Z3
        # Dafny 4.11 expects Z3 4.12.1; the z3-solver wheel ships the executable.
        run: |
          pip download z3-solver==4.12.1.0 --no-deps -d /tmp/z3
          python3 -m zipfile -e /tmp/z3/z3_solver-*.whl /tmp/z3/extracted
          install -m 755 /tmp/z3/extracted/z3_solver-4.12.1.0.data/data/bin/z3 /usr/local/bin/z3 || \
            sudo install -m 755 /tmp/z3/extracted/z3_solver-4.12.1.0.data/data/bin/z3 /usr/local/bin/z3
          z3 --version

      - name: Verify and recompile the Dafny-first core (Auctions.Domain.Verified)
        # Translation verifies the Dafny source first; a failed proof aborts generation.
        run: ./src/Auctions.Domain.Verified/generate.sh

      - name: Check compiled verified core is committed and up to date
        run: |
          drift=$(git status --porcelain -- src/Auctions.Domain.Verified)
          if [ -n "$drift" ]; then
            echo "src/Auctions.Domain.Verified is out of date; regenerate it and commit the result:"
            echo "  ./src/Auctions.Domain.Verified/generate.sh"
            echo "$drift"
            git diff -- src/Auctions.Domain.Verified
            exit 1
          fi

      - name: Regenerate Dafny skeletons from [Verify] methods
        run: dotnet run --project tools/CSharpToDafny -- --source src/Auctions.Domain --output verification/Generated

      - name: Check generated skeletons are committed and up to date
        # git status --porcelain covers modified, deleted AND untracked files — a plain
        # `git diff --exit-code` would miss a brand-new generated file that was never committed.
        run: |
          drift=$(git status --porcelain -- verification/Generated)
          if [ -n "$drift" ]; then
            echo "verification/Generated is out of date; regenerate it and commit the result:"
            echo "  dotnet run --project tools/CSharpToDafny -- --source src/Auctions.Domain --output verification/Generated"
            echo "$drift"
            git diff -- verification/Generated
            exit 1
          fi

      - name: Verify Dafny models
        run: |
          status=0
          for f in verification/Dafny/*.dfy verification/Generated/*.dfy; do
            echo "::group::dafny verify $f"
            dotnet tool run dafny -- verify "$f" || status=1
            echo "::endgroup::"
          done
          exit $status
